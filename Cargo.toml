[package]
name = "ai-sre"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Local-first incident investigation with evidence, bounded agents, and durable history"

[[bin]]
name = "ai-sre"
path = "surfaces/entrypoint.rs"

[build-dependencies]
sha2 = "0.10"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
