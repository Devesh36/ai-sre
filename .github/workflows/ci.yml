name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Interactive terminal acceptance
        run: python3 scripts/terminal-smoke.py target/debug/ai-sre
      - run: cargo run --locked -- eval
      - name: Harness conformance and repeatability
        run: cargo run --locked -- eval --suite harness --repeat 3 --output .ai-sre/harness.json
      - name: Retain harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: .ai-sre/harness.json
          if-no-files-found: error
          retention-days: 14
